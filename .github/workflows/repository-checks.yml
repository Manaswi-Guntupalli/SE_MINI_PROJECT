name: Repository checks

on:
  pull_request:
    branches: [develop, main]
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository and documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check changed lines for whitespace errors
        run: git diff --check HEAD^ HEAD
      - name: Verify relative documentation links
        run: python3 scripts/check_documentation.py
      - name: Describe the scope of this run
        run: |
          echo '## Repository checks' >> "$GITHUB_STEP_SUMMARY"
          echo 'Checked changed-line whitespace and local Markdown link destinations.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Application install/build/test execution remains pending under #44 until MERN code and real test suites are available. This run does not verify application correctness.' >> "$GITHUB_STEP_SUMMARY"
