name: Application CI

on:
  pull_request:
    branches: [develop, main]
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up the recorded Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Verify toolchain and commit
        run: node scripts/ci.mjs preflight
      - name: Install locked frontend and backend dependencies
        run: node scripts/ci.mjs install
      - name: Build and lint application
        run: node scripts/ci.mjs build
      - name: Run backend integration and frontend component suites
        run: node scripts/ci.mjs test
      - name: Verify real failing-test detection
        run: node scripts/ci.mjs verify-failure
      - name: Record incomplete Sprint 1 acceptance criteria
        run: node scripts/ci.mjs acceptance-report
      - name: Validate and record build/test evidence
        run: node scripts/ci.mjs evidence
      - name: Upload reports, coverage and frontend build
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-ci-${{ matrix.os }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            client/reports/
            server/reports/
            client/coverage/
            server/coverage/
            client/dist/
            ci-evidence/
      - name: Explain the scope of this run
        if: always()
        run: node scripts/ci-summary.mjs
